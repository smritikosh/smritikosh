<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-label="What you can build on Smritikosh, as six cards over two rows. The top row is shipping today over code, Markdown and config, and every card ends in a citation. Card one, five git repositories: gateway, service and worker in one index, so one question returns lines from whichever repository owns the answer, citing plt-notification-svc/handler.py lines 88 to 102. Card two, code plus Markdown: onboarding from docs and code together, where the handbook explains and the source proves, citing docs/billing-handbook.md lines 42 to 58. Card three, one repository: business rules you can check, the formula, the branch that changes it and the test that pins the number, citing src/billing/charges.py lines 176 to 193. The bottom row is the same ports with adapters not yet written, each marked soon: Slack threads for why a decision was made, PDF and DOCX for the clause rather than the whole contract, meeting notes for who committed to what by speaker turn, and CSV tables for the row that explains a number. Everything lands in one local smritikosh.duckdb file and is searched as a single corpus. Keywords: multi-repo code search, RAG use cases, Slack search, PDF retrieval, meeting notes, CSV ingestion, agent context, exact citations, line ranges.">
  <title>What you can build: multi-repo triage, docs-and-code onboarding and checkable business rules today; Slack, PDF, meeting notes and CSV on the same contract</title>

  <defs>
    <style>
      .sans{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .cap{font-size:10px;letter-spacing:.2em;font-weight:700}
      .tag{font-size:8px;letter-spacing:.14em;font-weight:700}
      .ink{fill:#0F172A}
      .mut{fill:#64748B}
      .faint{fill:#94A3B8}

      /* Sources that are live keep breathing; the unwritten ones below sit still. */
      .twinkle { animation: wb-twinkle 3.2s ease-in-out infinite; }
      @keyframes wb-twinkle { 0%,100% { opacity:.55 } 50% { opacity:1 } }

      @media (prefers-reduced-motion: reduce) {
        .twinkle { animation:none }
      }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="339" rx="18" fill="#FFFFFF" stroke="#C3CCD9"/>

