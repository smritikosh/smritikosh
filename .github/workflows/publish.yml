name: Publish

# Two ways in:
#   - push a v* tag        -> release to PyPI
#   - run manually         -> release to TestPyPI, for rehearsing a release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Actions are pinned to commit SHAs, not tags. This workflow holds the OIDC
# token that Trusted Publishing exchanges for the right to release, so a
# mutable ref here is a mutable ref with publish rights.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      # No lock file is committed, so this resolves fresh on every run.
      - run: uv sync --all-groups
      - run: make test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # A tag that disagrees with pyproject.toml would publish a version nobody
      # can find from the git history, and PyPI will not let it be replaced.
      - name: Check tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          project_version=$(uv version --short)
          tag_version=${GITHUB_REF_NAME#v}
          if [ "$project_version" != "$tag_version" ]; then
            echo "Tag $GITHUB_REF_NAME implies $tag_version, but pyproject.toml says $project_version." >&2
            exit 1
          fi

      - run: uv build

      # The .scm query files reach the wheel only through a package-data glob
      # in pyproject.toml; nothing else fails if that glob stops matching.
      # Counted against the tree rather than a literal, so adding a language
      # does not fail the release for an unrelated-looking reason.
      - name: Check wheel carries the tag queries
        run: |
          expected=$(find smritikosh/queries -name 'tags.scm' | wc -l | tr -d '[:space:]')
          found=$(unzip -l dist/*.whl | grep -c 'queries/.*/tags\.scm')
          if [ "$found" -ne "$expected" ]; then
            echo "Wheel carries $found tags.scm files; $expected are in smritikosh/queries/." >&2
            echo "Check [tool.setuptools.package-data] in pyproject.toml." >&2
            exit 1
          fi

      - run: uvx --from twine twine check dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write # mints the OIDC token that Trusted Publishing exchanges
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          # TestPyPI keeps earlier rehearsals of the same version around.
          skip-existing: true

  publish-pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # PyPI had 0.3.0 while the releases page still showed 0.2.0 as the newest
  # version. Notes come from CHANGELOG.md, which the release commit has already
  # updated, rather than from the commit log.
  github-release:
    needs: publish-pypi
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The default shallow checkout carries no tags, and the notes link to the
      # previous one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Release ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it alone."
            exit 0
          fi
          version=${TAG#v}
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $version." >&2
            exit 1
          fi
          previous=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
          if [ -n "$previous" ]; then
            printf '\n**Full changelog:** %s/compare/%s...%s\n' \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$previous" "$TAG" >> notes.md
          fi
          gh release create "$TAG" --title "$TAG" --notes-file notes.md
