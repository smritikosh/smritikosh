repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Must match the pinned ruff in pyproject.toml's dev group.
    rev: v0.16.7
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      # Delegates to the Makefile so the hook, `make check`, and CI run the same
      # suites against the same gate. A hook with its own threshold is worse than
      # no hook: it passes locally and fails in CI.
      - id: pytest
        name: pytest (smritikosh)
        language: system
        entry: make cov
        pass_filenames: false
        always_run: true
